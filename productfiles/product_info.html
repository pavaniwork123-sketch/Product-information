<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Products</title>
        <link rel="stylesheet" href="/static/product_info.css">
    </head>
    <body>
        <h2 style="padding:10px;height:30px;width:auto;background-color: rgb(188, 132, 240); color: white;text-align: center;">Products Hub</h2>
        <nav id="nav">
        <a id="home"href="/">Home</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a id="add" href="/add">Add New product</a>&nbsp;&nbsp;
        <a id="delete"href="/delete-page">Delete Product</a>
        </nav>      
        <div id="maincontainer">
            {% for p in products %}
            <div class="product">
                <h3>{{ p.product_name }}</h3>
                <h2>${{ p.product_price }}</h2>
                <p>{{ p.product_description }}</p>
            </div>
            {% endfor %}
        </div>  
    </body>
</html>
